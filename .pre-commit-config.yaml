default_language_version:
    python: python3.14

# https://pre-commit.ci configuration. Disable auto-fixing on PRs so the bot
# cannot rewrite intentional code (e.g. private typing references) and push
# commits back onto the branch.
ci:
  autofix_prs: false

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.4
    hooks:
      # Run the linter.
      - id: ruff
        files: "^django_msgspec_field/"
        exclude: ^.*\b(\.pytest_cache|\.venv|venv).*\b.*$
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format
        files: "^django_msgspec_field/"
        exclude: ^.*\b(\.pytest_cache|\.venv|venv).*\b.*$