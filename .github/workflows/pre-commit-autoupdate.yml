name: Pre-commit auto-update

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit autoupdate
        run: uv tool run pre-commit autoupdate

      - name: Update uv.lock
        run: uv lock

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          branch: pre-commit-autoupdate
          title: '[pre-commit.ci] pre-commit autoupdate'
          commit-message: '[pre-commit.ci] pre-commit autoupdate'
          body: |
            Updates pre-commit hooks to latest versions.

            Auto-generated by [pre-commit-autoupdate](https://github.com/peter-evans/create-pull-request) workflow.
          labels: dependencies

      - name: Enable auto-merge for PR
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
